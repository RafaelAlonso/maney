# The app's only locale. Everything a *user* reads is Portuguese (see the
# language policy in CLAUDE.md) — and validation messages reach the user through
# `errors.full_messages`, which prefixes each message with the humanized
# attribute name. Without the `attributes` maps below, a hand-written Portuguese
# message still comes out as "Initial balance não é um valor válido".
#
# Only what the user can actually be shown is translated; internal columns
# (amount_cents, total_cents) are remapped onto the form's field name by the
# form objects/controllers before rendering, so they are named here by the label
# the form shows.
pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]

  time:
    formats:
      default: "%d/%m/%Y %H:%M"

  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2

  support:
    array:
      words_connector: ", "
      two_words_connector: " e "
      last_word_connector: " e "

  errors:
    format: "%{attribute} %{message}"
    messages: &errors_messages
      inclusion: "não está na lista de valores permitidos"
      exclusion: "não está disponível"
      invalid: "não é válido"
      confirmation: "não corresponde a %{attribute}"
      blank: "não pode ficar em branco"
      present: "deve ficar em branco"
      too_long: "é longo demais (máximo %{count} caracteres)"
      too_short: "é curto demais (mínimo %{count} caracteres)"
      wrong_length: "não tem o tamanho esperado (%{count} caracteres)"
      not_a_number: "não é um número"
      not_an_integer: "não é um número inteiro"
      greater_than: "deve ser maior que %{count}"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      equal_to: "deve ser igual a %{count}"
      less_than: "deve ser menor que %{count}"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"
      other_than: "deve ser diferente de %{count}"
      odd: "deve ser ímpar"
      even: "deve ser par"
      taken: "já está em uso"
      required: "é obrigatório"
      accepted: "precisa ser aceito"

  activemodel:
    errors:
      messages: *errors_messages
    attributes:
      expense_entry:
        name: "Nome"
        amount: "Valor"
        date: "Data"
        category_id: "Categoria"
        payment_method: "Método"
        card_id: "Cartão"
        installment: "Parcelado"
        installments_count: "Nº de parcelas"
        first_installment: "Parcela inicial"

  activerecord:
    errors:
      messages: *errors_messages
      models:
        card_schedule:
          attributes:
            closing_day:
              inclusion: "deve estar entre 1 e 31"
            due_day:
              inclusion: "deve estar entre 1 e 31"
        card:
          attributes:
            closing_day:
              inclusion: "deve estar entre 1 e 31"
            due_day:
              inclusion: "deve estar entre 1 e 31"
    models:
      card: "Cartão"
      card_schedule: "Programação do cartão"
      category: "Categoria"
      budget: "Orçamento"
      expense: "Gasto"
      income: "Ganho"
      installment_purchase: "Compra parcelada"
      setting: "Configuração"
      user: "Pessoa"
      invitation: "Convite"
    attributes:
      card:
        name: "Nome"
        closing_day: "Dia de fechamento"
        due_day: "Dia de vencimento"
        card_schedules: "Dias do cartão"
      card_schedule:
        closing_day: "Dia de fechamento"
        due_day: "Dia de vencimento"
        valid_from: "Vigente a partir de"
      category:
        name: "Nome"
        role: "Papel"
        budget_amount: "Orçado"
      budget:
        month: "Mês"
        amount_cents: "Orçado"
        budget_amount: "Orçado"
        category: "Categoria"
      expense:
        name: "Nome"
        amount_cents: "Valor"
        date: "Data"
        category: "Categoria"
        card: "Cartão"
        payment_method: "Método"
        installment_number: "Parcela"
      income:
        name: "Nome"
        amount: "Valor"
        amount_cents: "Valor"
        date: "Data"
      installment_purchase:
        name: "Nome"
        amount: "Valor total"
        total_cents: "Valor total"
        date: "Data"
        category: "Categoria"
        card: "Cartão"
        installments_count: "Nº de parcelas"
        first_installment: "Parcela inicial"
      setting:
        first_month: "Primeiro mês"
        initial_balance: "Saldo inicial"
        initial_balance_cents: "Saldo inicial"
        alert_threshold_percent: "Limite de alerta"
      user:
        email_address: "E-mail"
        password: "Senha"
        consent: "Consentimento"
