service: maney

image: rafaelalonso/maney

servers:
  web:
    - 157.245.90.120

  # Runs Solid Queue. Without it nothing performs an enqueued job, and a
  # `deliver_later` invitation or password-reset email is never sent — silently,
  # since the person was already told a link was on its way.
  #
  # Same host as the web role: this is one small instance, and the work is a
  # handful of emails a year plus the nightly erasure sweep.
  #
  # Only the web container migrates (see bin/docker-entrypoint), so on the very
  # first deploy this one can come up before Solid Queue's tables exist and
  # restart until they do. That settles itself; it is not a failed deploy.
  job:
    hosts:
      - 157.245.90.120
    cmd: ./bin/jobs
    env:
      clear:
        # config/recurring.yml schedules the nightly purge at 4am; the app's
        # own time zone is UTC, so this is what makes 4am mean 4am in São Paulo.
        # Matches the backup accessory below.
        TZ: America/Sao_Paulo

# DigitalOcean's Ubuntu droplets enable root login over the SSH key by default,
# so Kamal connects as root directly.
ssh:
  user: root

proxy:
  ssl: true
  host: maney.net
  app_port: 80
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: RafaelAlonso
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    DB_HOST: maney-db
    # The app's public address, which invitation and password-reset links are
    # built from. Deliberately has no fallback in production.rb: a default
    # would send perfectly deliverable mail carrying links to localhost, with
    # nothing anywhere reporting a failure. Unset, the app refuses to boot.
    MANEY_HOST: maney.net
    # The sender address verified in Brevo. Both roles need these — the job
    # container is what actually renders and sends the mail.
    MANEY_MAIL_FROM: rafael.p.alonso@gmail.com
  secret:
    - RAILS_MASTER_KEY
    - MANEY_DATABASE_PASSWORD

accessories:
  db:
    image: postgres:17
    host: 157.245.90.120
    # Published to loopback only. Postgres is never reachable from the internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: maney
        POSTGRES_DB: maney_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # A host directory, outside every container's lifecycle. This is what
      # makes an expense survive a deploy.
      - data:/var/lib/postgresql/data

  backup:
    image: ghcr.io/rafaelalonso/maney-backup:latest
    host: 157.245.90.120
    env:
      clear:
        TZ: America/Sao_Paulo
        PGHOST: maney-db
        PGUSER: maney
        PGDATABASE: maney_production
        AGE_RECIPIENT: age1ycwx2u66yxtyjjd4fpyy39w0p25967ru33x8qj0hjsmdwmkqmftqt9m8r6
        R2_BUCKET: maney-backups
        R2_ENDPOINT: https://01c38df21a638681506e2d2e6838e528.r2.cloudflarestorage.com
        BACKUP_PREFIX: nightly
      secret:
        - POSTGRES_PASSWORD
        - R2_ACCESS_KEY_ID
        - R2_SECRET_ACCESS_KEY
        - HEALTHCHECK_URL
